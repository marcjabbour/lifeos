<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Stylized "L" for LifeOS -->
  <path d="M 160 120 L 160 340 L 320 340 L 320 300 L 200 300 L 200 120 Z" fill="white" opacity="0.95"/>

  <!-- Nova star accent -->
  <circle cx="340" cy="160" r="40" fill="url(#accentGradient)"/>
  <circle cx="340" cy="160" r="20" fill="white" opacity="0.9"/>

  <!-- Glow effect rings -->
  <circle cx="340" cy="160" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <circle cx="340" cy="160" r="60" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>
