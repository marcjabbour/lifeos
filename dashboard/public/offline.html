<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeOS - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 400px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      opacity: 0.6;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #00d4ff, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #a1a1aa;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    button {
      background: linear-gradient(135deg, #00d4ff, #8b5cf6);
      color: #050508;
      border: none;
      padding: 12px 32px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    .glow-orb {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      pointer-events: none;
    }

    .glow-orb.cyan {
      background: #00d4ff;
      top: -100px;
      right: -100px;
    }

    .glow-orb.purple {
      background: #8b5cf6;
      bottom: -100px;
      left: -100px;
    }
  </style>
</head>
<body>
  <div class="glow-orb cyan"></div>
  <div class="glow-orb purple"></div>

  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M12 12h.01" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round"/>
    </svg>

    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry - your data is safe and will sync when you're back online.</p>

    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
